
{% block main %}

<h1>Login</h1>

<form method="post">

    {% csrf_token %}

    <p>
        Username:
        <input type="text" name="username">
    </p>

    <p>
        Password:
        <input type="password" name="password">
    </p>

    <button type="submit">
        Login
    </button>

</form>

<form method="post" action="{% url 'like_artigo' artigo.id %}?next={{ request.path }}">
    
{% if erro %}
    <p>{{ erro }}</p>
{% endif %}

{% endblock %}
